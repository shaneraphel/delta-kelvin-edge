<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>On-device interval temperature</title>
  <style>
    body { font-family: ui-sans-serif, system-ui, sans-serif; margin: 2rem; max-width: 44rem; }
    label { display: block; margin: 0.6rem 0; }
    .err { color: #a20; }
  </style>
</head>
<body>
  <h1>On-device interval temperature</h1>
  <p>No cloud AI APIs. Interval temperature has no affine origin. Point Celsius may move to kelvin by 273.15.</p>
  <label>kind <select id="kind"><option>interval</option><option>point</option><option>kelvin</option></select></label>
  <label>target <select id="target"><option>point</option><option>interval</option><option>kelvin</option></select></label>
  <label>magnitude <input id="mag" type="number" value="3" step="0.01" /></label>
  <button id="go">Convert</button>
  <p id="out"></p>
  <script>
    const OFFSET = 273.15;
    function convert(magnitude, kind, target) {
      if (kind === "interval" && target === "point") throw new Error("interval temperature has no affine origin");
      if (kind === "point" && target === "interval") throw new Error("point temperature has no interval meaning");
      if (kind === "point" && target === "kelvin") return magnitude + OFFSET;
      if (kind === "kelvin" && target === "point") return magnitude - OFFSET;
      return magnitude;
    }
    document.getElementById("go").onclick = () => {
      const out = document.getElementById("out");
      try {
        const v = convert(Number(document.getElementById("mag").value), document.getElementById("kind").value, document.getElementById("target").value);
        out.className = "";
        out.textContent = String(v);
      } catch (e) {
        out.className = "err";
        out.textContent = e.message;
      }
    };
  </script>
</body>
</html>
